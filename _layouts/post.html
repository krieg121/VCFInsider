---
layout: default
---

<header class="post-header">
  <div class="container">
    <h1 class="post-title">{{ page.title }}</h1>
    {% if page.subtitle %}<p class="post-subtitle">{{ page.subtitle }}</p>{% endif %}

    <time class="post-date" datetime="{{ page.date | date_to_xmlschema }}">
      {{ page.date | date: "%b %-d, %Y" }}
    </time>

    {% if page.author %}
      <p class="post-author">By {{ page.author }}</p>
    {% endif %}
  </div>
</header>

{% if page.image %}
<div class="container">
  <div class="post-featured-image">
    <img src="{{ page.image | relative_url }}" alt="{{ page.title | escape }}">
  </div>
</div>
{% endif %}

<main class="post-content"{% if page.collection == 'posts' %} data-reading-progress{% endif %}>
  <div class="container">
    {{ content }}

    {% include community-cta.html %}
  </div>
</main>
